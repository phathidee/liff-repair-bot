<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuduBot Support Form</title>
  <!-- โหลด LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #00b900; margin-bottom: 5px; }
    .user-info { background: #eef9ee; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; border-left: 4px solid #00b900; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; background: #00b900; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button:hover { background: #009900; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PuduBot Support</h2>
    <div class="user-info" id="statusBox">
      กำลังเชื่อมต่อระบบ LINE...
    </div>

    <form id="repairForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>🏢 รหัสสาขา:</label>
        <input type="text" id="branchId" required placeholder="เช่น M101, K001">
      </div>

      <div class="form-group">
        <label>🤖 Serial Number (SN) หุ่นยนต์:</label>
        <input type="text" id="robotSN" required placeholder="ระบุ SN หรือเลือกจากระบบ">
      </div>

      <div class="form-group">
        <label>📂 ประเภทการแจ้ง:</label>
        <select id="issueType">
          <option value="แจ้งอาการเสีย">🛠️ แจ้งอาการเสีย</option>
          <option value="แจ้งอุบัติเหตุ">💥 แจ้งอุบัติเหตุ</option>
          <option value="เบิกอะไหล่">📦 เบิกอะไหล่</option>
          <option value="อื่นๆ">⋯ อื่นๆ</option>
        </select>
      </div>

      <div class="form-group">
        <label>✍️ รายละเอียดเพิ่มเติม:</label>
        <textarea id="issueDetail" rows="4" required placeholder="อธิบายอาการหรือปัญหาที่พบ..."></textarea>
      </div>

      <button type="submit" id="submitBtn" disabled>⏳ กำลังโหลดข้อมูล...</button>
    </form>
  </div>

  <script>
    const LIFF_ID = "2012542205-zgC0w2sX"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNaltNr_y9PUuWmX0_7zjCT5uN5wYGf1OT2H3nC1jPLwdVAcmerSzCGwH4PtuxOFN5LA/exec";

    let globalProfile = null;

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        globalProfile = await liff.getProfile();
        
        if (globalProfile && globalProfile.userId) {
          document.getElementById("statusBox").innerHTML = 
            `<b>✅ เข้าสู่ระบบสำเร็จ</b><br>` +
            `👤 ชื่อ: ${globalProfile.displayName}<br>` +
            `🔑 User ID: <span style="font-size:11px; color:#555;">${globalProfile.userId}</span>`;
          
          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = false;
          submitBtn.innerText = "🚀 ส่งข้อมูลแจ้งซ่อม";
        } else {
          document.getElementById("statusBox").innerHTML = "⚠️ ไม่สามารถดึง User ID ได้ กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น";
        }

      } catch (error) {
        console.error("LIFF initialization failed:", error);
        document.getElementById("statusBox").innerHTML = "❌ เกิดข้อผิดพลาดในการโหลด LIFF: " + error.message;
      }
    }

    function handleSubmit(event) {
      event.preventDefault();

      if (!globalProfile || !globalProfile.userId) {
        alert("⚠️ ไม่พบข้อมูล User ID กรุณารีเฟรชหน้าเว็บหรือเปิดผ่านแอป LINE อีกครั้ง");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังส่งข้อมูล...";

      try {
        const payload = {
          action: "createTicket",
          userId: globalProfile.userId,
          displayName: globalProfile.displayName,
          branchId: document.getElementById("branchId").value.trim(),
          robotSN: document.getElementById("robotSN").value.trim(),
          issueType: document.getElementById("issueType").value,
          issueDetail: document.getElementById("issueDetail").value.trim(),
          jobType: "ซ่อม"
        };

        // ใช้เทคนิค Hidden Form ผ่าน Iframe เพื่อตัดปัญหา 400 Bad Request
        const form = document.createElement("form");
        form.method = "POST";
        form.action = WEB_APP_URL;
        form.target = "hidden_iframe";

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "postData";
        input.value = JSON.stringify(payload);
        form.appendChild(input);

        let iframe = document.getElementById("hidden_iframe");
        if (!iframe) {
          iframe = document.createElement("iframe");
          iframe.name = "hidden_iframe";
          iframe.id = "hidden_iframe";
          iframe.style.display = "none";
          document.body.appendChild(iframe);
        }

        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        alert("✅ ส่งข้อมูลแจ้งซ่อมเรียบร้อยแล้ว!");
        setTimeout(() => {
          liff.closeWindow(); 
        }, 500);

      } catch (error) {
        console.error("Error submitting form:", error);
        alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล: " + error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 ส่งข้อมูลแจ้งซ่อม";
      }
    }

    initLiff();
  </script>
</body>
</html>
