<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งซ่อม / ปิดเคสหุ่นยนต์</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 450px; margin: auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { margin: 5px 0; color: #333; font-size: 20px; }
    .header p { color: #666; font-size: 14px; margin: 0; }
    .tab-group { display: flex; background: #eee; border-radius: 8px; padding: 3px; margin-bottom: 20px; }
    .tab-btn { flex: 1; border: none; background: transparent; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; color: #555; }
    .tab-btn.active { background: #fff; color: #0056b3; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button.submit-btn { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button.submit-btn:disabled { background-color: #94a3b8; }
    .loading-spinner { display: none; text-align: center; margin: 10px 0; color: #0056b3; font-size: 13px; }
    .alert-badge { background: #fee2e2; color: #dc2626; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; font-weight: bold; text-align: center; display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>🤖 ระบบแจ้งซ่อม / ปิดเคสหุ่นยนต์</h2>
    <p>ผู้ใช้งาน: <span id="user-display-name">กำลังโหลด...</span></p>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" onclick="setMode('open')">เปิดเคสใหม่</button>
    <button class="tab-btn" onclick="setMode('close')">ปิดเคส</button>
  </div>

  <div id="loading" class="loading-spinner">กำลังโหลดข้อมูล...</div>
  <div id="open-tickets-count-badge" class="alert-badge">⚠️ มีเคสค้างทั้งหมด X เคส ในระบบ</div>

  <form id="repair-form">
    <!-- Search Suggestion สำหรับค้นหาและเลือกสาขา -->
    <div class="form-group">
      <label for="branch-input" id="branch-label">รหัสสาขา / ชื่อสาขา (พิมพ์เพื่อค้นหา):</label>
      <input type="text" id="branch-input" list="branch-list" placeholder="เช่น M101, พระราม 2..." onchange="onBranchSelected()" required>
      <datalist id="branch-list"></datalist>
    </div>

    <!-- Dropdown เลือก Robot SN (โหมดเปิดเคส) -->
    <div class="form-group" id="robot-sn-group">
      <label for="robot-sn">หมายเลขซีเรียล (SN หุ่นยนต์):</label>
      <select id="robot-sn" required>
        <option value="">-- เลือกรหัสสาขาก่อน --</option>
      </select>
    </div>

    <!-- Dropdown สำหรับโหมดปิดเคส (เลือก Ticket ID ที่ยังค้างอยู่) -->
    <div class="form-group" id="open-tickets-group" style="display: none;">
      <label for="open-tickets">เลือกรายการเคสที่ต้องการปิด:</label>
      <select id="open-tickets">
        <option value="">-- กรุณาเลือกสาขาก่อน --</option>
      </select>
    </div>

    <div class="form-group" id="issue-type-group">
      <label for="issue-type">หมวดหมู่ปัญหา:</label>
      <select id="issue-type">
        <option value="1. แจ้งอาการเสีย">1. แจ้งอาการเสีย</option>
        <option value="2. สอบถาม/เบิกอะไหล่">2. สอบถาม/เบิกอะไหล่</option>
        <option value="3. แจ้งอุบัติเหตุ">3. แจ้งอุบัติเหตุ</option>
      </select>
    </div>

    <div class="form-group">
      <label for="issue-detail" id="detail-label">รายละเอียดอาการเบื้องต้น:</label>
      <textarea id="issue-detail" rows="3" placeholder="ระบุรายละเอียด..." required></textarea>
    </div>

    <button type="button" class="submit-btn" id="submit-btn" onclick="submitForm()">ยืนยันการเปิดเคส</button>
  </form>
</div>

<script>
  const LIFF_ID = "2012406861-CdqnKRov";
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjqc9DLeR9VMBm2d_5V0tb7rkH5o0imrF58f_Fy6dif5tCcP9LKlAF8Ubu_uO4lzt4Ag/exec";

  let currentMode = 'open';
  let userProfile = { userId: "LINE_USER", displayName: "LINE User" };
  let branchesData = [];
  let robotsData = [];
  let openTicketsData = [];
  let branchesWithOpenTickets = [];

  window.onload = function() {
    initializeLiff();
    loadBranchSuggestions();
  };

  function initializeLiff() {
    liff.init({ liffId: LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        liff.getProfile().then(profile => {
          userProfile = profile;
          document.getElementById('user-display-name').innerText = profile.displayName;
        });
      }
    }).catch(err => console.error('LIFF Init Error:', err));
  }

  // โหลดข้อมูลสาขาทั้งหมด (ใช้ตอนโหมดเปิดเคส)
  function loadBranchSuggestions() {
    if (currentMode !== 'open') return;
    showLoading(true);
    fetch(`${GAS_WEB_APP_URL}?action=getBranches`)
      .then(res => res.json())
      .then(res => {
        showLoading(false);
        if (res.status === 'success') {
          branchesData = res.data;
          renderBranchDatalist(branchesData);
        }
      });
  }

  // โหลดเฉพาะสาขาที่มีเคสค้าง (ใช้ตอนโหมดปิดเคส)
  function loadBranchesWithOpenTickets() {
    showLoading(true);
    fetch(`${GAS_WEB_APP_URL}?action=getBranchesWithOpenTickets`)
      .then(res => res.json())
      .then(res => {
        showLoading(false);
        if (res.status === 'success') {
          branchesWithOpenTickets = res.data;
          
          // คำนวณจำนวนเคสค้างทั้งหมดรวมทุกสาขา
          let totalOpenCount = branchesWithOpenTickets.reduce((sum, b) => sum + b.count, 0);
          const badge = document.getElementById('open-tickets-count-badge');
          
          if (totalOpenCount > 0) {
            badge.innerText = `⚠️ มีเคสค้างทั้งหมด ${totalOpenCount} เคส ในระบบ (${branchesWithOpenTickets.length} สาขาที่ต้องเคลียร์)`;
            badge.style.display = 'block';
          } else {
            badge.innerText = `✅ ไม่มีเคสค้างในระบบขณะนี้`;
            badge.style.backgroundColor = '#d1fae5';
            badge.style.color = '#065f46';
            badge.style.display = 'block';
          }

          // แสดงเฉพาะสาขาที่มีเคสค้างใน Datalist ค้นหา
          renderBranchDatalist(branchesWithOpenTickets);
        }
      });
  }

  function renderBranchDatalist(list) {
    const datalist = document.getElementById('branch-list');
    datalist.innerHTML = '';
    list.forEach(b => {
      const opt = document.createElement('option');
      let labelSuffix = b.count ? ` (ค้าง ${b.count} เคส)` : '';
      opt.value = `${b.branchId} - ${b.branchName}${labelSuffix}`;
      datalist.appendChild(opt);
    });
  }

  // เมื่อเลือกหรือพิมพ์เลือกสาขา
  function onBranchSelected() {
    const val = document.getElementById('branch-input').value;
    const branchId = val.split(' - ')[0].trim();
    
    if (!branchId) return;

    if (currentMode === 'open') {
      showLoading(true);
      fetch(`${GAS_WEB_APP_URL}?action=getRobotsByBranch&branchId=${branchId}`)
        .then(res => res.json())
        .then(res => {
          showLoading(false);
          robotsData = res.data;
          const robotSelect = document.getElementById('robot-sn');
          robotSelect.innerHTML = '<option value="">-- เลือก SN หุ่นยนต์ --</option>';
          robotsData.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.robotSN;
            opt.innerText = `${r.robotSN} (${r.robotModel})`;
            robotSelect.appendChild(opt);
          });
        });
    } else {
      showLoading(true);
      fetch(`${GAS_WEB_APP_URL}?action=getOpenTicketsByBranch&branchId=${branchId}`)
        .then(res => res.json())
        .then(res => {
          showLoading(false);
          openTicketsData = res.data;
          const ticketSelect = document.getElementById('open-tickets');
          ticketSelect.innerHTML = ''; 
          
          if (openTicketsData.length === 0) {
            const opt = document.createElement('option');
            opt.value = "";
            opt.innerText = "-- ไม่มีเคสค้างในสาขานี้ --";
            ticketSelect.appendChild(opt);
          } else {
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.innerText = "-- เลือกรายการเคสค้าง --";
            ticketSelect.appendChild(defaultOpt);

            openTicketsData.forEach(t => {
              const opt = document.createElement('option');
              opt.value = t.rowIndex;
              opt.innerText = `[${t.robotSN}] ${t.category} (แจ้งโดย: ${t.openedBy})`;
              ticketSelect.appendChild(opt);
            });
          }
        });
    }
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    // เคลียร์ค่าฟอร์มเมื่อสลับโหมด
    document.getElementById('repair-form').reset();
    document.getElementById('branch-input').value = '';

    if (mode === 'open') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('robot-sn-group').style.display = 'block';
      document.getElementById('open-tickets-group').style.display = 'none';
      document.getElementById('issue-type-group').style.display = 'block';
      document.getElementById('detail-label').innerText = 'รายละเอียดอาการเบื้องต้น:';
      document.getElementById('submit-btn').innerText = 'ยืนยันการเปิดเคส';
      document.getElementById('open-tickets-count-badge').style.display = 'none';
      loadBranchSuggestions();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('robot-sn-group').style.display = 'none';
      document.getElementById('open-tickets-group').style.display = 'block';
      document.getElementById('issue-type-group').style.display = 'none';
      document.getElementById('detail-label').innerText = 'บันทึกการแก้ไข / หมายเหตุปิดเคส:';
      document.getElementById('submit-btn').innerText = 'ยืนยันการปิดเคส';
      loadBranchesWithOpenTickets(); // โหลดเฉพาะสาขาที่มีเคสค้างทันที
    }
  }

  function submitForm() {
    const branchVal = document.getElementById('branch-input').value;
    const branchId = branchVal.split(' - ')[0].trim();
    const branchName = branchVal.split(' - ')[1] || branchId;
    const detail = document.getElementById('issue-detail').value;

    if (!branchId || !detail) {
      alert('กรุณากรอกข้อมูลให้ครบถ้วน');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = 'กำลังส่งข้อมูล...';

    let payload = {
      action: currentMode === 'open' ? 'createTicket' : 'closeTicket',
      branchId: branchId,
      branchName: branchName,
      userId: userProfile.userId,
      displayName: userProfile.displayName
    };

    if (currentMode === 'open') {
      const robotSN = document.getElementById('robot-sn').value;
      if (!robotSN) { 
        alert('กรุณาเลือก SN หุ่นยนต์'); 
        btn.disabled = false; 
        btn.innerText = 'ยืนยันการเปิดเคส'; 
        return; 
      }
      
      const selectedRobot = robotsData.find(r => r.robotSN === robotSN) || {};
      payload.robotSN = robotSN;
      payload.issueType = document.getElementById('issue-type').value;
      payload.issueDetail = detail;
      payload.vendorName = selectedRobot.vendorName || '';
      payload.areaEmail = selectedRobot.areaEmail || '';
      payload.regionalEmail = selectedRobot.regionalEmail || '';
    } else {
      const rowIndex = document.getElementById('open-tickets').value;
      if (!rowIndex) { 
        alert('กรุณาเลือกเคสที่ต้องการปิด'); 
        btn.disabled = false; 
        btn.innerText = 'ยืนยันการปิดเคส'; 
        return; 
      }
      const selectedTicket = openTicketsData.find(t => t.rowIndex == rowIndex) || {};
      payload.rowIndex = rowIndex;
      payload.robotSN = selectedTicket.robotSN;
      payload.resolution = detail;
    }

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      btn.disabled = false;
      btn.innerText = currentMode === 'open' ? 'ยืนยันการเปิดเคส' : 'ยืนยันการปิดเคส';
      
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        document.getElementById('repair-form').reset();
      }
    })
    .catch(err => {
      alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      btn.disabled = false;
      btn.innerText = currentMode === 'open' ? 'ยืนยันการเปิดเคส' : 'ยืนยันการปิดเคส';
    });
  }

  function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
  }
</script>
</body>
</html>
