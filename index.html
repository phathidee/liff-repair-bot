<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuduBot Support Form</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h2>ระบบแจ้งซ่อม PuduBot</h2>
  <form id="repairForm" onsubmit="handleSubmit(event)">
    <label>รหัสสาขา:</label><br>
    <input type="text" id="branchId" required placeholder="เช่น M101"><br><br>

    <label>Serial Number (SN):</label><br>
    <input type="text" id="robotSN" required placeholder="ระบุ SN หุ่นยนต์"><br><br>

    <label>ประเภทอาการเสีย:</label><br>
    <select id="issueType">
      <option value="แจ้งอาการเสีย">แจ้งอาการเสีย</option>
      <option value="แจ้งอุบัติเหตุ">แจ้งอุบัติเหตุ</option>
    </select><br><br>

    <label>รายละเอียด:</label><br>
    <textarea id="issueDetail" rows="4" required placeholder="ระบุรายละเอียด..."></textarea><br><br>

    <button type="submit">ส่งข้อมูลแจ้งซ่อม</button>
  </form>

  <script>
    const LIFF_ID = "2012542205-zgC0w2sX"; // ใส่ LIFF ID ของคุณ
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNaltNr_y9PUuWmX0_7zjCT5uN5wYGf1OT2H3nC1jPLwdVAcmerSzCGwH4PtuxOFN5LA/exec"; // ใส่ Web App URL ของคุณ

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (err) {
        console.error("LIFF initialization failed", err);
      }
    }
    main();

    async function handleSubmit(event) {
      event.preventDefault();
      
      try {
        const profile = await liff.getProfile();
        const payload = {
          action: "createTicket",
          userId: profile.userId,
          displayName: profile.displayName,
          branchId: document.getElementById("branchId").value,
          robotSN: document.getElementById("robotSN").value,
          issueType: document.getElementById("issueType").value,
          issueDetail: document.getElementById("issueDetail").value,
          jobType: "ซ่อม"
        };

        // ส่งข้อมูลแบบ POST ไปยัง Google Apps Script Web App
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("✅ ส่งข้อมูลแจ้งซ่อมเรียบร้อยแล้ว!");
        liff.closeWindow(); // ปิดหน้าต่าง LIFF อัตโนมัติหลังส่งสำเร็จ
      } catch (error) {
        console.error("Error submitting form:", error);
        alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล");
      }
    }
  </script>
</body>
</html>
